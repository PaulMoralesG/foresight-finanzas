<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17917a"/>
      <stop offset="1" stop-color="#0a453a"/>
    </linearGradient>
  </defs>
  <!-- Fondo completo: válido como maskable (safe zone 100%) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Trending-up dentro de la safe zone central (80%) -->
  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="128 320 224 224 304 272 384 176"/>
    <polyline points="336 176 384 176 384 224"/>
  </g>
</svg>
