<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17917a"/>
      <stop offset="1" stop-color="#0a453a"/>
    </linearGradient>
  </defs>

  <!-- Fondo a sangre y SIN esquinas redondeadas: la forma la pone el sistema
       (círculo, squircle, gota…). Un rx aquí dejaría esquinas recortadas. -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Flecha al 75% respecto del icono normal.
       El icono `any` ocupa casi todo el lienzo, y eso funciona sin recorte;
       pero Android muestra solo el 66% central de un maskable y AMPLÍA para
       llenar la forma. Con la flecha a tamaño completo el resultado era una
       banda blanca de borde a borde con dos medias lunas azules: leía como
       un ojo, no como el logo.
       A 0.75 el radio máximo del trazo queda en ~134 de 512 (el área visible
       llega a ~169), así que respira dentro de cualquier máscara. -->
  <g transform="translate(256,256) scale(0.75) translate(-256,-256)"
     fill="none" stroke="#ffffff" stroke-width="42"
     stroke-linecap="round" stroke-linejoin="round">
    <polyline points="128 320 224 224 304 272 384 176"/>
    <polyline points="336 176 384 176 384 224"/>
  </g>
</svg>
