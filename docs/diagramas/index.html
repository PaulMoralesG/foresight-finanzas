<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foresight: diagrama completo</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --line:#dcdcd6; --tab:#ffffff; --accent:#2f6fde; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141413; --fg:#ecece8; --muted:#a3a39c; --line:#33332f; --tab:#1d1d1b; --accent:#7aa7ff; } }
  :root[data-theme="dark"] { --bg:#141413; --fg:#ecece8; --muted:#a3a39c; --line:#33332f; --tab:#1d1d1b; --accent:#7aa7ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:12px 16px 0; }
  h1 { margin:0 0 2px; font-size:16px; font-weight:600; }
  p.sub { margin:0 0 10px; color:var(--muted); font-size:12px; }
  nav { display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); padding:0 16px; }
  nav button { flex:none; border:1px solid transparent; border-bottom:none; background:none; color:var(--muted); padding:8px 12px; font:inherit; cursor:pointer; border-radius:6px 6px 0 0; }
  nav button[aria-selected="true"] { background:var(--tab); color:var(--fg); border-color:var(--line); margin-bottom:-1px; }
  nav button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  main { flex:1; min-height:0; }
  iframe { width:100%; height:100%; border:0; display:block; background:var(--bg); }
  .abrir { margin-left:auto; flex:none; align-self:center; font-size:12px; color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Foresight Finanzas: diagrama completo</h1>
  <p class="sub">Commit 452542b. Cada pestaña es un diagrama Archify validado por separado; este índice solo los agrupa.</p>
</header>
<nav role="tablist" aria-label="Vistas">
  <button role="tab" data-src="arquitectura.html">1. Arquitectura</button>
  <button role="tab" data-src="estado-stores.html">2. Estado</button>
  <button role="tab" data-src="sync-supabase.html">3. Sincronización</button>
  <button role="tab" data-src="sesion-auth.html">4. Sesión</button>
  <button role="tab" data-src="modelo-datos.html">5. Modelo de datos</button>
  <button role="tab" data-src="flujo-movimiento.html">6a. Guardar movimiento</button>
  <button role="tab" data-src="flujo-recurrencias-respaldo.html">6b. Recurrencias y respaldo</button>
  <a class="abrir" id="abrir" href="arquitectura.html" target="_blank" rel="noopener">Abrir sola ↗</a>
</nav>
<main><iframe id="vista" title="Diagrama" src="arquitectura.html"></iframe></main>
<script>
  const botones = [...document.querySelectorAll('nav button')];
  const marco = document.getElementById('vista');
  const abrir = document.getElementById('abrir');
  function elegir(b) {
    botones.forEach((x) => x.setAttribute('aria-selected', String(x === b)));
    marco.src = b.dataset.src; abrir.href = b.dataset.src;
    try { localStorage.setItem('foresight-diagrama-tab', b.dataset.src); } catch (e) {}
  }
  botones.forEach((b) => b.addEventListener('click', () => elegir(b)));
  let guardada = null;
  try { guardada = localStorage.getItem('foresight-diagrama-tab'); } catch (e) {}
  elegir(botones.find((b) => b.dataset.src === guardada) || botones[0]);
</script>
</body>
</html>
